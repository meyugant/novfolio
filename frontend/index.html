<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/novfoliologo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Novfolio is a professional portfolio builder for students, developers, designers, researchers, and professionals. Create and share a portfolio showcasing your projects, skills, experience, and education."

    <meta name="theme-color" content="#ffffff" />

    <meta name="author" content="Novfolio" />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://novfolio.com/" />

    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Novfolio",
      "alternateName": "Novfolio Portfolio Builder",
      "url": "https://novfolio.com/"
    }

    <!-- Open Graph -->

    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Novfolio – Create Your Professional Portfolio"
    />

    <meta
      property="og:description"
      content="Create and share a professional online portfolio. Showcase your projects, skills, education, and experience with Novfolio."
    />

    <meta property="og:url" content="https://novfolio.com/" />

    <meta property="og:site_name" content="Novfolio" />

    <meta property="og:image" content="https://novfolio.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Novfolio – Create Your Professional Portfolio"
    />

    <meta
      name="twitter:description"
      content="Create and share a professional online portfolio with Novfolio."
    />

    <meta name="twitter:image" content="https://novfolio.com/og-image.png" />

    <title>Novfolio – Create Your Professional Portfolio</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Novfolio",
        "alternateName": "Novfolio Portfolio Builder",
        "url": "https://novfolio.com/"
      }
    </script>
